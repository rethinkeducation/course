<style>
  html, body { margin: 0; height: 100%; background: #A6F76B; font-family: "Noto Sans TC", system-ui, sans-serif; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  #splash { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: #A6F76B; transition: opacity .4s; }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash img { width: 120px; height: auto; animation: bob 1.6s ease-in-out infinite; }

  .dots { display: flex; gap: 6px; } .dots i { width: 8px; height: 8px; border-radius: 50%; background: #000; animation: d 1s infinite; } .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }

  .label { margin: 0; font-weight: 900; font-size: 18px; }
  #tip { margin: 0; max-width: 420px; font-size: 15px; line-height: 1.6; background: #fff; border-radius: 14px; padding: 12px 16px; transition: opacity .3s; }
  @media (prefers-reduced-motion: reduce) { #splash img, .dots i { animation: none; } }

<script>
  // ▼▼▼ 你的網頁應用程式網址（結尾是 /exec），已經幫你填好 ▼▼▼
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyo9ADUKchR84ycvpwtYO0zA4dIp2c-4AI9wlUcejwPpPvk-haRyGgsJWHA_ifX50S4Uw/exec';
  // ▲▲▲ 只有換部署網址時才需要改 ▲▲▲

  var TIPS = ['不鏽鋼吸管要用超過 1000 次，才比一次性塑膠吸管環保', '棉布袋要用 131 次以上，才比一個塑膠袋更環保', '判斷回收價值的口訣：好收集、量大、賣得好、好再造', '電子發票是感熱紙，要丟一般垃圾，不是紙類回收', '沙灘就是生活的縮影：海灘上的垃圾，來自你我的日常', '寶特瓶和瓶蓋可以一起回收，不用分開', '環保餐具買了要常用，用得夠久才是真的環保', '從源頭減量，比事後回收更有效'];
  // 先用上次存下的文字，再到後台抓最新設定（在後台「設定 → 等待畫面」修改）
  try { var cached = JSON.parse(localStorage.getItem('rt_tips') || 'null'); if (cached && cached.length) TIPS = cached; } catch (e) { }
  fetch(APP_URL + '?tips=1').then(function (r) { return r.json(); }).then(function (j) { if (j && j.tips && j.tips.length) { TIPS = j.tips; try { localStorage.setItem('rt_tips', JSON.stringify(j.tips)); } catch (e) { } } }).catch(function () { });
  var tip = document.getElementById('tip'), i = Math.floor(Math.random() * TIPS.length);
  tip.textContent = TIPS[i];
  var timer = setInterval(function () { tip.style.opacity = 0; setTimeout(function () { i = Math.floor(Math.random() * TIPS.length); tip.textContent = TIPS[i]; tip.style.opacity = 1; }, 300); }, 3500);
  function done() { var s = document.getElementById('splash'); if (s.classList.contains('hide')) return; s.classList.add('hide'); clearInterval(timer); }
  window.addEventListener('message', function (e) { if (e.data === 'rt-ready') done(); });
  setTimeout(done, 25000);   // 最多 25 秒後一定收起

  var t = new URLSearchParams(location.search).get('t');
  document.getElementById('app').src = APP_URL + (t ? '?t=' + encodeURIComponent(t) : '');
</script>
</body>
</html>
