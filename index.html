<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RE-THINK 講師選課</title>
<!-- 主畫面圖示（iPhone 與 Android） -->
<link rel="apple-touch-icon" href="https://i.ibb.co/5W7LjJ1x/1.png">
<link rel="icon" type="image/png" href="https://i.ibb.co/5W7LjJ1x/1.png">
<meta name="apple-mobile-web-app-title" content="講師選課">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8AE71A">
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe id="app" title="RE-THINK 講師選課" allow="clipboard-write"></iframe>
<script>
  // ▼▼▼ 把下面這行換成你的網頁應用程式網址（結尾是 /exec） ▼▼▼
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyo9ADUKchR84ycvpwtYO0zA4dIp2c-4AI9wlUcejwPpPvk-haRyGgsJWHA_ifX50S4Uw/exec';
  // ▲▲▲ 只需要改這一行 ▲▲▲

  // 如果網址帶有專屬登入碼（?t=...），一起傳給選課網站，從主畫面開啟就不用重新登入
  var t = new URLSearchParams(location.search).get('t');
  document.getElementById('app').src = APP_URL + (t ? '?t=' + encodeURIComponent(t) : '');
</script>
</body>
</html>
